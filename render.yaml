# Configuración oficial de Render (Blueprint)
# Asociación de Bananeros San Luis (ASBA) - U.E. San Luis 2026
services:
  - type: web
    name: asba-sanluis
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
